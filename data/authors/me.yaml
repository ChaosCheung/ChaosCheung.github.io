bio: I received my Ph.D degree from University of Electronic Science and Technology of China (UESTC) under the supervision of Prof. Chunxiang Xu. During my doctoral studies, I received the UESTC Outstanding Student Award. I also completed a one-year research visit at The Hong Kong Polytechnic University, hosted by Prof. Man Ho Allen Au. In recent years, my research has been published in leading cybersecurity journals, including IEEE TIFS, IEEE TDSC, and IEEE TMC. I have led or contributed to several national research projects supported by the National Key R&D Program of China and the National Natural Science Foundation of China.
  

